apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: jellyfin
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://jellyfin.github.io/jellyfin-helm
    chart: jellyfin
    targetRevision: 3.2.0
    helm:
      values: |
        env:
          TZ: America/New_York
          DOTNET_USE_POLLING_FILE_WATCHER: "1"
        persistence:
          config:
            enabled: true
            accessMode: ReadWriteOnce
            size: 5Gi
            storageClass: longhorn
          media:
            enabled: true
            type: pvc
            accessMode: ReadWriteMany
            size: 1000Gi
            storageClass: nfs-media
        ingress:
          enabled: false
        service:
          type: ClusterIP
  destination:
    server: https://kubernetes.default.svc
    namespace: jellyfin
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true