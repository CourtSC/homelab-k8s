apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: hass-tls
  namespace: default
spec:
  secretName: hass-tls
  issuerRef:
    name: letsencrypt-cloudflare
    kind: ClusterIssuer
  dnsNames:
    - hass.scottccourt.com
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: hass-app-tls
  namespace: default
spec:
  secretName: hass-app-tls
  issuerRef:
    name: letsencrypt-cloudflare
    kind: ClusterIssuer
  dnsNames:
    - hass-app.scottccourt.com