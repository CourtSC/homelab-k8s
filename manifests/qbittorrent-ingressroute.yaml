apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: forwarded-https
  namespace: downloads
spec:
  headers:
    customRequestHeaders:
      X-Forwarded-Proto: "https"
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: qbittorrent-websecure
  namespace: downloads
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`qbittorrent.scottccourt.com`)
      kind: Rule
      services:
        - name: qbittorrent
          port: 8080
  tls:
    secretName: qbittorrent-tls
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: qbittorrent-web
  namespace: downloads
spec:
  entryPoints:
    - web
  routes:
    - match: Host(`qbittorrent.scottccourt.com`)
      kind: Rule
      services:
        - name: qbittorrent
          port: 8080
      middlewares:
        - name: forwarded-https